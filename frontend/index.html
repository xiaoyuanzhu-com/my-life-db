<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyLifeDB</title>
    <meta name="description" content="MyLifeDB - A filesystem-based personal knowledge management system for organizing your digital life." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      crossorigin="use-credentials" is required, not cosmetic. Without it the
      browser fetches the manifest with credentials mode "omit" — no cookies.
      Behind the cloud gateway (my.xiaoyuanzhu.com) an uncredentialed request
      to an ambiguous root path is treated as logged-out and answered with the
      cloud SPA's index.html at 200, so the browser parses HTML as JSON and
      reports "Manifest: Line 1, column 1, Syntax error". With use-credentials
      the session cookie rides along, the gateway proxies to the instance, and
      the real manifest is returned. Harmless for self-hosted (same-origin).
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

    <!-- Prevent FOUC: Apply dark mode class and color-scheme before first paint -->
    <script>
      (function() {
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        // Set color-scheme to prevent browser UI flash (scrollbars, inputs, etc.)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>

    <!-- Claude Code UI Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/entry.spa.tsx"></script>
  </body>
</html>
